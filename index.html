<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Vault & Library</title>
  <link rel="stylesheet" href="src/css/styles.css">
</head>
<body>

  <header>
    <h1>Online Library Vault</h1>
  </header>

  <main>
    <!-- Category Filter Bar -->
    <div id="filter-bar" class="filter-bar">
      <button class="filter-btn active" onclick="filterCategory('all', this)">All</button>
    </div>

    <!-- Catalog Grid -->
    <div id="catalog" class="catalog-grid">
      <div class="status-msg">Loading catalog...</div>
    </div>
  </main>

  <script src="src/js/app.js"></script>
</body>
</html>
