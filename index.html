<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Vault & Library</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
    }

    header {
      background-color: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(8px);
      padding: 1.5rem 2rem;
      border-bottom: 1px solid #334155;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      margin: 0;
      font-size: 1.5rem;
      color: var(--accent);
      letter-spacing: -0.025em;
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }

    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 2rem;
    }

    .book-card {
      background-color: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #334155;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
      display: flex;
      flex-direction: column;
    }

    .book-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      border-color: var(--accent);
    }

    .cover-container {
      width: 100%;
      height: 280px;
      background-color: #334155;
      overflow: hidden;
    }

    .cover-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .book-info {
      padding: 1rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .book-info h3 {
      margin: 0 0 0.5rem 0;
      font-size: 1.1rem;
      line-height: 1.3;
      color: var(--text-main);
    }

    .book-info p {
      margin: 0;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .status-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 1rem;
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    .error-msg {
      color: #f87171;
    }
  </style>
</head>
<body>

  <header>
    <h1>Online Library Vault</h1>
  </header>

  <main>
    <div id="catalog" class="catalog-grid">
      <div class="status-msg">Loading books from database...</div>
    </div>
  </main>

  <script>
    const API_URL = 'https://b2-pdf-gateway.rco-architect.workers.dev/api/books';

    async function loadCatalog() {
      const catalogElement = document.getElementById('catalog');

      try {
        const response = await fetch(API_URL);
        
        if (!response.ok) {
          throw new Error(`HTTP error! Status: ${response.status}`);
        }

        const books = await response.json();

        if (!Array.isArray(books) || books.length === 0) {
          catalogElement.innerHTML = '<div class="status-msg">No books currently available in the database.</div>';
          return;
        }

        catalogElement.innerHTML = '';

        books.forEach(book => {
          const card = document.createElement('div');
          card.className = 'book-card';
          
          // Redirect to reader page passing the b2_key parameter
          card.onclick = () => {
            window.location.href = `src/pages/reader?book=${encodeURIComponent(book.b2_key)}`;
          };

          card.innerHTML = `
            <div class="cover-container">
              <img src="${book.cover_url}" alt="${book.title}" loading="lazy" onerror="this.src='https://via.placeholder.com/200x280?text=No+Cover'">
            </div>
            <div class="book-info">
              <h3>${book.title}</h3>
              <p>By ${book.author}</p>
            </div>
          `;

          catalogElement.appendChild(card);
        });

      } catch (err) {
        console.error('Failed to fetch database records:', err);
        catalogElement.innerHTML = `
          <div class="status-msg error-msg">
            Failed to load library catalog.<br>
            <small style="color: #94a3b8; font-size: 0.85rem;">Ensure Cloudflare D1 binding "DB" is attached to the Worker.</small>
          </div>
        `;
      }
    }

    document.addEventListener('DOMContentLoaded', loadCatalog);
  </script>
</body>
</html>
