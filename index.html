<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Vault & Library</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
    }

    header {
      background-color: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(8px);
      padding: 1.5rem 2rem;
      border-bottom: 1px solid #334155;
    }

    header h1 {
      margin: 0;
      font-size: 1.5rem;
      color: var(--accent);
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }

    /* Category Filter Bar */
    .filter-bar {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: #1e293b;
      color: var(--text-muted);
      border: 1px solid #334155;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    .filter-btn:hover, .filter-btn.active {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
      font-weight: bold;
    }

    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 2rem;
    }

    .book-card {
      background-color: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #334155;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .book-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
    }

    .cover-container {
      width: 100%;
      height: 280px;
      background-color: #334155;
    }

    .cover-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .book-info {
      padding: 1rem;
    }

    .book-info h3 {
      margin: 0 0 0.5rem 0;
      font-size: 1.1rem;
    }

    .book-info p {
      margin: 0 0 0.5rem 0;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .category-badge {
      display: inline-block;
      background: #334155;
      color: var(--accent);
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Online Library Vault</h1>
  </header>

  <main>
    <!-- Category Filter Bar -->
    <div id="filter-bar" class="filter-bar">
      <button class="filter-btn active" onclick="filterCategory('all', this)">All</button>
    </div>

    <!-- Catalog Grid -->
    <div id="catalog" class="catalog-grid">
      <div style="grid-column: 1/-1; text-align: center; color: #94a3b8;">Loading catalog...</div>
    </div>
  </main>

  <script>
    const BASE_WORKER_URL = 'https://b2-pdf-gateway.rco-architect.workers.dev';
    let allBooks = [];

    async function initLibrary() {
      try {
        // Fetch categories and books simultaneously
        const [catRes, bookRes] = await Promise.all([
          fetch(`${BASE_WORKER_URL}/api/categories`),
          fetch(`${BASE_WORKER_URL}/api/books`)
        ]);

        const categories = await catRes.json();
        allBooks = await bookRes.json();

        renderCategories(categories);
        renderBooks(allBooks);
      } catch (err) {
        console.error('Error loading library:', err);
      }
    }

    function renderCategories(categories) {
      const filterBar = document.getElementById('filter-bar');
      categories.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn';
        btn.textContent = cat.name;
        btn.onclick = () => filterCategory(cat.id, btn);
        filterBar.appendChild(btn);
      });
    }

    function renderBooks(books) {
      const catalog = document.getElementById('catalog');
      catalog.innerHTML = '';

      if (books.length === 0) {
        catalog.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #94a3b8;">No books found in this category.</div>';
        return;
      }

      books.forEach(book => {
        const card = document.createElement('div');
        card.className = 'book-card';
        card.onclick = () => {
          window.location.href = `src/pages/reader?book=${encodeURIComponent(book.b2_key)}`;
        };

        card.innerHTML = `
          <div class="cover-container">
            <img src="${book.cover_url}" alt="${book.title}" onerror="this.src='https://via.placeholder.com/200x280?text=No+Cover'">
          </div>
          <div class="book-info">
            <h3>${book.title}</h3>
            <p>By ${book.author}</p>
            <span class="category-badge">${book.category_name || 'Uncategorized'}</span>
          </div>
        `;
        catalog.appendChild(card);
      });
    }

    function filterCategory(catId, btnElement) {
      // Toggle active button style
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');

      // Filter books
      if (catId === 'all') {
        renderBooks(allBooks);
      } else {
        const filtered = allBooks.filter(book => book.category_id === catId);
        renderBooks(filtered);
      }
    }

    document.addEventListener('DOMContentLoaded', initLibrary);
  </script>
</body>
</html>
